<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometrydle</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <!-- Loading -->
    <div id="loadingScreen" class="loading-screen text-center">
        <p>Loading levels...</p>
    </div>

    <!-- Score -->
    <div class="text-center mt-3">
        <h4>Score: <span id="scoreValue">0</span></h4>
    </div>

    <!-- Logo -->
    <div class="container text-center my-3">
        <img src="img/logo.png" class="img-fluid" style="max-width: 250px;">
    </div>

    <!-- Welcome -->
    <div class="container text-center mb-4 px-3">
        <p>
            Welcome to Geometrydle! Try and guess which level has more downloads!
        </p>
    </div>

    <!-- GAME -->
    <div class="container">
        <div class="row g-3">

            <!-- BOX 1 -->
            <div class="col-12 col-md-6">
                <div class="box text-center p-4 h-100" id="box1">
                    <img id="diff1" class="img-fluid mb-2" style="max-height: 80px;">
                    <h5 id="levelname1"></h5>
                    <p id="downloads1">?</p>
                </div>
            </div>

            <!-- BOX 2 -->
            <div class="col-12 col-md-6">
                <div class="box text-center p-4 h-100" id="box2">
                    <img id="diff2" class="img-fluid mb-2" style="max-height: 80px;">
                    <h5 id="levelname2"></h5>
                    <p id="downloads2">?</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Game Over -->
    <div id="gameOverScreen" class="game-over-screen d-none">
        <div class="game-over-content text-center">
            <h2>Game Over!</h2>
            <p>Your final score: <span id="finalScore">0</span></p>
            <button id="restartButton" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="container text-center mt-5 small">
        <p>Website by devpiruleib</p>
    </div>

</body>
<script src="script.js"></script>
</html>
